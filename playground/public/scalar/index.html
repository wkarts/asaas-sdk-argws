<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scalar UI - Asaas SDK Proxy</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #app { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Scalar API Reference (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest/dist/browser.js"></script>

    <script>
      // OpenAPI gerado dinamicamente pela SDK instalada no playground
      Scalar.createApiReference('#app', {
        url: '/openapi.json'
      })
    </script>
  </body>
</html>

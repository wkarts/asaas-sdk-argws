<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swagger UI - Asaas SDK Playground</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      // IMPORTANTE:
      // O container costuma servir arquivos estáticos do /public antes de cair no Slim.
      // Se existir um /public/openapi.json antigo, o Swagger acabaria carregando ele.
      // Para garantir sempre a especificação DINÂMICA (gerada pela SDK instalada),
      // apontamos direto para o endpoint do Slim.
      const SPEC_URL = "/api/sdk/openapi";

      // Exibe a versão instalada da SDK no título (quando disponível).
      fetch("/api/sdk/version")
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          if (j && j.sdk && j.sdk.version) {
            document.title = `Swagger UI - Asaas SDK Playground v${j.sdk.version}`;
          }
        })
        .catch(() => {});

      SwaggerUIBundle({
        url: SPEC_URL,
        dom_id: "#swagger-ui",
        docExpansion: "list",
      });
    </script>
  </body>
</html>

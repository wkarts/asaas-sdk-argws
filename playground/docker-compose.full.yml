services:
  playground:
    build:
      context: ..
      dockerfile: playground/Dockerfile
    env_file: .env
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - playground

volumes:
  caddy_data:
  caddy_config:

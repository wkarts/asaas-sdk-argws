name: Build & Push Playground (Docker Hub)

on:
  push:
    branches: [ main ]
    paths:
      - "playground/**"
      - ".github/workflows/docker-playground.yml"
  pull_request:
    paths:
      - "playground/**"
      - ".github/workflows/docker-playground.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.check.outputs.should_push }}
      image_name: ${{ steps.check.outputs.image_name }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug contexto
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"

      - name: Decide se pode publicar
        id: check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/asaas-sdk-argws-playground"
          TAGS="${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA}"

          SHOULD_PUSH="false"

          # Só publica em push na main e se secrets existirem
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
              SHOULD_PUSH="true"
            fi
          fi

          # Log amigável (sem vazar segredo)
          echo "should_push=${SHOULD_PUSH}"
          echo "dockerhub_username_is_set=$([[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]] && echo yes || echo no)"
          echo "dockerhub_token_is_set=$([[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]] && echo yes || echo no)"

          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sempre)
        uses: docker/build-push-action@v5
        with:
          context: ./playground
          file: ./playground/Dockerfile
          push: false
          tags: asaas-sdk-argws-playground:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.should_push == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./playground
          file: ./playground/Dockerfile
          push: true
          tags: ${{ needs.build.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

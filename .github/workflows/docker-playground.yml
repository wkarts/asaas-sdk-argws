name: Build & Push Playground (Docker Hub)

on:
  push:
    branches: [ main ]
    paths:
      - "playground/**"
      - ".github/workflows/docker-playground.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "playground/**"
      - ".github/workflows/docker-playground.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (CI)
        uses: docker/build-push-action@v5
        with:
          context: ./playground
          file: ./playground/Dockerfile
          push: false
          tags: asaas-sdk-argws-playground:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]] || (echo "::error::Missing Secret DOCKERHUB_USERNAME" && exit 1)
          [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]] || (echo "::error::Missing Secret DOCKERHUB_TOKEN" && exit 1)

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/asaas-sdk-argws-playground"

          TAGS="${IMAGE}:sha-${GITHUB_SHA}"

          # Se for push na main, publica latest
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS}
${IMAGE}:latest"
          fi

          # Se for tag vX.Y.Z, publica vX.Y.Z
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            TAGS="${TAGS}
${IMAGE}:${VER}"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./playground
          file: ./playground/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build Playground Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - "playground/**"
  pull_request:
    paths:
      - "playground/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide push e tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PUSH=false
          TAGS="asaas-sdk-argws-playground:ci-${GITHUB_SHA}"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" \
                && -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            PUSH=true
            TAGS="${{ secrets.DOCKERHUB_USERNAME }}/asaas-sdk-argws-playground:latest,${{ secrets.DOCKERHUB_USERNAME }}/asaas-sdk-argws-playground:sha-${GITHUB_SHA}"
          fi

          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push when enabled)
        uses: docker/build-push-action@v5
        with:
          context: ./playground
          file: ./playground/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

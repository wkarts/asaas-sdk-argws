name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    env:
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
      ASAAS_ENV: ${{ secrets.ASAAS_ENV }}
      ASAAS_APP_NAME: ${{ secrets.ASAAS_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist      
      - run: composer asaas:sdk-build
      - run: git diff --exit-code
      - run: composer test
      - run: composer lint
      - run: php bin/verify-parity.php
      - name: Integration tests
        if: env.ASAAS_API_KEY != ''
        run: phpunit --testsuite integration

name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint
      - run: php bin/verify-parity.php
      - name: Integration tests
        if: ${{ secrets.ASAAS_API_KEY != '' }}
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_ENV: ${{ secrets.ASAAS_ENV }}
          ASAAS_APP_NAME: ${{ secrets.ASAAS_APP_NAME }}
        run: phpunit --testsuite integration
